const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function hexRgb(hex){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
function shade(hex,amt){const[r,g,b]=hexRgb(hex);const f=amt<0?0:255,p=Math.abs(amt);return`rgb(${Math.round((f-r)*p+r)},${Math.round((f-g)*p+g)},${Math.round((f-b)*p+b)})`;}
function rgba(hex,a){const[r,g,b]=hexRgb(hex);return`rgba(${r},${g},${b},${a})`;}
function lum(hex){const[r,g,b]=hexRgb(hex);return(0.299*r+0.587*g+0.114*b)/255;}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}

function newPage(kind){const p={id:uid(),items:[],done:false};if(kind&&kind!=='normal')p.kind=kind;return p;}

function normalizeState(){
  if(!S)S=defaultState();

  for(const k in d)if(S[k]===undefined)S[k]=d[k];
  for(const b of S.books){if(!b.pages||!b.pages.length)b.pages=[newPage()];b.cur=clamp(b.cur|0,0,b.pages.length-1);if(!PAPERS[b.paper])b.paper='lined';if(!b.diag)b.diag=[];}

}

/* ---------- text wrapping (indices kept for caret mapping) ---------- */
function fontOf(it){return`${it.size}px ${FONTS[it.font]||FONTS.hand}`;}
function wrapText(text,font,maxW){
  MC.font=font;const out=[];let base=0;
  for(const para of text.split('\n')){
    let a=0,lastSpace=-1,i=0;
    if(!para.length)out.push({s:'',a:base,b:base});
    while(i<para.length){
      const ch=para[i];
      if(ch!==' '&&i>a&&MC.measureText(para.slice(a,i+1)).width>maxW){
        const cut=lastSpace>=a?lastSpace+1:i;
        out.push({s:para.slice(a,cut),a:base+a,b:base+cut});a=cut;lastSpace=-1;continue;
      }
      if(ch===' ')lastSpace=i;i++;
    }
    if(para.length)out.push({s:para.slice(a),a:base+a,b:base+para.length});
    base+=para.length+1;
  }
  return out;
}
function textDy(it){return it.dy!=null?it.dy:-6;}
function caretPos(it,lines,k){
  let j=0;for(let i=0;i<lines.length;i++)if(lines[i].a<=k&&k<=lines[i].b)j=i;
  const ln=lines[j];MC.font=fontOf(it);
  return{x:it.x+MC.measureText(ln.s.slice(0,k-ln.a)).width,y:it.y+j*it.lh,j};
}
function textIndexAt(it,u,v){
  const lines=wrapText(it.text,fontOf(it),it.w);
  const j=clamp(Math.floor((v-(it.y-it.lh*0.8))/it.lh),0,lines.length-1);
  const ln=lines[j];MC.font=fontOf(it);let best=ln.a,bd=1e9;
  for(let k=ln.a;k<=ln.b;k++){const d=Math.abs(it.x+MC.measureText(ln.s.slice(0,k-ln.a)).width-u);if(d<bd){bd=d;best=k;}}
  return best;
}
function fitText(c,text,fam,maxW,maxSize,minSize,weight){
  weight=weight||'bold';let size=maxSize;c.font=`${weight} ${size}px ${fam}`;
  while(size>minSize&&c.measureText(text).width>maxW){size-=1;c.font=`${weight} ${size}px ${fam}`;}
  if(c.measureText(text).width>maxW&&text.includes(' ')){
    const w=text.split(' ');let best=null;
    for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' '),b=w.slice(i).join(' ');const m=Math.max(c.measureText(a).width,c.measureText(b).width);if(!best||m<best.m)best={a,b,m};}
    let s2=maxSize*0.85;c.font=`${weight} ${s2}px ${fam}`;
    while(s2>8&&Math.max(c.measureText(best.a).width,c.measureText(best.b).width)>maxW){s2-=1;c.font=`${weight} ${s2}px ${fam}`;}
    return{size:s2,lines:[best.a,best.b],font:c.font};
  }
  return{size,lines:[text],font:c.font};
}
function fitLines(fit,x,y,fn){const lh=fit.size*1.08,y0=y-(fit.lines.length-1)*lh/2;fit.lines.forEach((l,i)=>fn(l,x,y0+i*lh));}

/* ---------- paper ---------- */
function drawPaper(c,key,seed,book){
  const P=PAPERS[key]||PAPERS.lined,r=mulberry(seed||7),END=1236;
  c.fillStyle=P.bg;c.fillRect(0,0,PW,PH);
  const L=(y,col,w)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(0,y);c.lineTo(PW,y);c.stroke();};
  const V=(x,col,w,y0,y1)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x,y0==null?0:y0);c.lineTo(x,y1==null?PH:y1);c.stroke();};
  const label=(t,x,y,col,sz)=>{c.font=`bold ${sz||20}px ${FONTS.neat}`;c.fillStyle=col;c.textAlign='left';c.textBaseline='alphabetic';c.fillText(t,x,y);};
  switch(key){
    case 'lined':for(let y=P.top;y<=END;y+=P.lh)L(y,'#a9c8ea',2);V(P.ml-14,'#ef9a9a',2.5);label('Date: ________',760,P.top-60,'#b9cbe0',22);break;
    case 'legal':for(let y=P.top;y<=END;y+=P.lh)L(y,'#8fb0d8',2);V(P.ml-24,'#e57373',2);V(P.ml-16,'#e57373',2);break;
    case 'grid':for(let x=0;x<=PW;x+=25)V(x,x%125===0?'#a7c4ea':'#d8e5f7',x%125===0?1.8:1.1);for(let y=0;y<=PH;y+=25)L(y,y%125===0?'#a7c4ea':'#d8e5f7',y%125===0?1.8:1.1);break;
    case 'graph':for(let x=0;x<=PW;x+=10)V(x,x%50===0?'#9ccfa4':'#e0f1e2',x%50===0?1.4:.7);for(let y=0;y<=PH;y+=10)L(y,y%50===0?'#9ccfa4':'#e0f1e2',y%50===0?1.4:.7);break;
    case 'dots':c.fillStyle='#b7b4c8';for(let x=40;x<PW;x+=40)for(let y=40;y<=END;y+=40){c.beginPath();c.arc(x,y,2.6,0,7);c.fill();}break;

const coverCache=new Map();
function coverImg(b,big){
  const key=[b.title,b.cover,b.color,b.font,b.tstyle,b.icon].join('|');
  const sc=big?Math.min(3,big):Math.min(2,DPR)*0.62;
  const ck=b.id+(big?'B':'S');let e=coverCache.get(ck);
  if(!e||e.key!==key||Math.abs(e.sc-sc)>.01){

function pathPts(c,p){

const VOW=/[aeiouyàáâäãåèéêëìíîïòóôöõùúûüÿ]/g;
function wordValue(w){
  if(/^[0-9.,+\-*/=^%()<>×÷πθ√≈≤≥]+$/.test(w))return /[0-9]/.test(w)?Math.min(w.length,6):0; // numbers & maths count
  if(/^[A-Z]{2,6}s?$/.test(w))return w.length;   // acronyms like DNA, HTML, WWII
  const s=w.toLowerCase().replace(/[^a-zà-öø-ÿ]/g,'');if(!s)return 0;
  if(s.length>22||/(.)\1\1/.test(s))return -1;
  if(s.length>=4){
    const v=(s.match(VOW)||[]).length/s.length;
    if(v<.1||v>.85)return -1;
    if(/[^aeiouyàáâäãåèéêëìíîïòóôöõùúûüÿ]{6,}/.test(s))return -1;
    if(s.length>=6&&/^(.{1,4})\1{2,}/.test(s))return -1;
    if(MASH.some(m=>!MASH_OK.includes(m)&&s.includes(m)))return -1;
    let rare=0;for(let i=1;i<s.length;i++)if(RARE_BG.has(s[i-1]+s[i]))rare++;
    if(rare>=2||(rare&&s.length<7))return -1;

}
function textQuality(p){

    for(const raw of it.text.split(/[\s—–/]+/)){const w=raw.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,'');if(!w)continue;
      const v=wordValue(w);if(v<0){if(w.length>=3)junk++;continue;}if(!v)continue;
      const key=w.toLowerCase(),n=(counts.get(key)||0)+1;counts.set(key,n);total++;
      if(n>(STOP.has(key)?40:3))continue;      // repeating the same word over and over earns nothing

  walkPts(it.pts,8,(x,y)=>{const r=it.size/2;for(const[dx,dy]of[[0,0],[-r,0],[r,0],[0,-r],[0,r]])set.add(Math.floor((x+dx)/25)+','+Math.floor((y+dy)/25));});

  if(c&&c.items===p.items&&c.key===key)return c.v;
  const tq=textQuality(p),ink=new Set();let media=0,shapes=0,st=0;
  for(const it of p.items){switch(it.type){
    case 'stroke':{const cells=cellsOf(it);

      if(it.tool==='highlighter')break;

function buildPDF(imgs){
  // a tiny PDF writer: one full-bleed JPEG per page
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;};
  const obj=(id,fn)=>{off[id]=len;push(`${id} 0 obj\n`);fn();push('\nendobj\n');};
  const PWpt=595,PHpt=773.5,n=imgs.length,kids=[];for(let i=0;i<n;i++)kids.push(`${3+i*3} 0 R`);
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`));
  imgs.forEach((im,i)=>{const pid=3+i*3,cid=pid+1,iid=pid+2,cs=`q ${PWpt} 0 0 ${PHpt} 0 0 cm /Im0 Do Q`;
    obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PWpt} ${PHpt}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));
    obj(cid,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(iid,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);push(im.bytes);push('\nendstream');});});
  const max=2+n*3,xref=len;let x=`xref\n0 ${max+1}\n0000000000 65535 f \n`;for(let i=1;i<=max;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${max+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}

let STORE_CAP=5e6,storeUsed=0,storeWarned=0;
function measureUsed(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=k.length+(localStorage.getItem(k)||'').length;}}catch(e){}return n;}
function probeCapacity(){
  try{const c=sessionStorage.getItem('sdCap');if(c){STORE_CAP=+c;return;}}catch(e){}
  const used=measureUsed(),k='__sdProbe';let lo=0,hi=12e6;
  try{while(hi-lo>50000){const mid=Math.floor((lo+hi)/2);try{localStorage.setItem(k,'x'.repeat(mid));lo=mid;}catch(e){hi=mid;}}}finally{try{localStorage.removeItem(k);}catch(e){}}
  STORE_CAP=Math.max(1e6,used+lo);try{sessionStorage.setItem('sdCap',String(STORE_CAP));}catch(e){}
}
function storePct(){return clamp(storeUsed/STORE_CAP,0,1);}
const fmtMB=n=>(n*2/1048576).toFixed(n*2<1048576?2:1)+' MB';   // JS strings are ~2 bytes per character

const AMB_PRESETS=[['☕ Cosy',{lofi:.6,fire:.55}],['🌧️ Rainy day',{piano:.65,rain:.55}],['🌿 Nature',{forest:.6,ocean:.45}],['🎧 Focus',{lofi:.7}]];
function ambState(){if(!S.amb)S.amb={master:.7,ch:{}};for(const a of AMB_LIST)if(!S.amb.ch[a.k])S.amb.ch[a.k]={on:false,vol:.6};return S.amb;}
const AMB={master:null,rev:null,buf:{},ch:{},ducked:false,timer:null};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function ambNoiseBuf(type,sec){
  const sr=AC.sampleRate,n=Math.floor(sr*sec),F=Math.floor(sr*.25),b=AC.createBuffer(2,n,sr);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;
      if(type==='white')d[i]=w*.5;
      else if(type==='pink'){b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926;}
      else{last=(last+.02*w)/1.02;d[i]=last*3.5;}}
    for(let i=0;i<F;i++){const t=i/F;d[i]=d[i]*t+d[n-F+i]*(1-t);}}   // seamless loop
  b.loopEnd=(n-F)/sr;return b;
}
function ambImpulse(sec,decay){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);}return b;}
function ambInit(){
  ensureAudio();if(!AC)return false;if(AMB.master)return true;
  AMB.master=AC.createGain();AMB.master.gain.value=0;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3;AMB.master.connect(comp);comp.connect(AC.destination);
  AMB.rev=AC.createConvolver();AMB.rev.buffer=ambImpulse(2.6,2.4);const rg=AC.createGain();rg.gain.value=.6;AMB.rev.connect(rg);rg.connect(AMB.master);
  AMB.buf.white=ambNoiseBuf('white',4);AMB.buf.pink=ambNoiseBuf('pink',6);AMB.buf.brown=ambNoiseBuf('brown',6);
  AMB.timer=setInterval(ambTick,60);ambApplyMaster();return true;
}
function ambApplyMaster(){if(!AMB.master)return;const v=AMB.ducked?0:ambState().master;AMB.master.gain.setTargetAtTime(v*v,AC.currentTime,.25);}
function ambDuck(on){if(AMB.ducked===on)return;AMB.ducked=on;ambApplyMaster();}
// ---- building blocks
function loopNoise(type,dest,rate){const s=AC.createBufferSource(),b=AMB.buf[type];s.buffer=b;s.loop=true;s.loopEnd=b.loopEnd;if(rate)s.playbackRate.value=rate;s.connect(dest);s.start(0,Math.random()*(b.loopEnd-.1));return s;}
function filt(type,f,q){const n=AC.createBiquadFilter();n.type=type;n.frequency.value=f;if(q!=null)n.Q.value=q;return n;}
function gainN(v){const g=AC.createGain();g.gain.value=v;return g;}
function chain(...n){for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[0];}
function burst(ch,t,{f=3000,q=1,amp=.1,dur=.04,type='bandpass',dest}){
  const s=AC.createBufferSource();s.buffer=AMB.buf.white;const fl=filt(type,f,q),g=AC.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  chain(s,fl,g,dest||ch.in);s.start(t,Math.random()*3);s.stop(t+dur+.05);

function atone(ch,t,{f,type='sine',amp=.05,a=.01,d=.5,dest,detune=0,send=0}){

function ambStart(k){
  if(!ambInit())return;const st=ambState().ch[k],def=AMB_DEF[k];let ch=AMB.ch[k];
  if(ch&&!ch.stopping){ch.out.gain.setTargetAtTime(st.vol*st.vol,AC.currentTime,.2);return;}
  if(ch){ch.out.gain.cancelScheduledValues(AC.currentTime);ch.stopping=false;clearTimeout(ch.kill);ch.out.gain.setTargetAtTime(st.vol*st.vol,AC.currentTime,.4);return;}
  ch={src:[],in:gainN(AMB_LEVEL[k]||1),out:gainN(0),rev:gainN(def.rev||.2)};ch.in.connect(ch.out);ch.out.connect(AMB.master);ch.out.connect(ch.rev);ch.rev.connect(AMB.rev);
  def.start(ch);ch.out.gain.setTargetAtTime(st.vol*st.vol,AC.currentTime,.6);AMB.ch[k]=ch;
}
function ambStop(k){const ch=AMB.ch[k];if(!ch||ch.stopping)return;ch.stopping=true;ch.out.gain.setTargetAtTime(0,AC.currentTime,.35);
  ch.kill=setTimeout(()=>{for(const s of ch.src)try{s.stop();}catch(e){}ch.out.disconnect();delete AMB.ch[k];},2200);}
function ambTick(){if(!AC)return;const now=AC.currentTime;for(const k in AMB.ch){const ch=AMB.ch[k];if(!ch.stopping)try{AMB_DEF[k].tick(ch,now);}catch(e){console.error(e);}}}

let ambResumed=false;
function ambResume(){if(ambResumed||!ambAnyOn())return;ambResumed=true;if(!ambInit())return;for(const x of AMB_LIST)if(ambState().ch[x.k].on)ambStart(x.k);}
function ambToggle(k,on){const st=ambState().ch[k];st.on=on==null?!st.on:on;ambResumed=true;if(st.on)ambStart(k);else ambStop(k);markDirty();}
function ambSetVol(k,v){const st=ambState().ch[k];st.vol=v;if(!st.on&&v>0){ambToggle(k,true);return;}const ch=AMB.ch[k];if(ch&&!ch.stopping)ch.out.gain.setTargetAtTime(v*v,AC.currentTime,.08);markDirty();}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let lastTs=0,remT=0;
function drawSaved(){const a=1-(performance.now()-savedAt)/1600;if(!savedAt||a<=0||view!=='book'||anim)return;ctx.globalAlpha=Math.min(1,a*2);ctx.fillStyle='rgba(30,18,10,.8)';rr(ctx,W-92,H-96,82,26,13);ctx.fill();ctx.fillStyle='#b9f6ca';ctx.font=`bold 12px ${FONTS.neat}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✓ Saved',W-51,H-82);ctx.globalAlpha=1;}
let lastInput=0,frameNo=0,DPR_CAP=2,perfAcc=0,perfN=0,perfCheck=0,skipDt=0;
['pointerdown','pointermove','keydown','wheel'].forEach(ev=>addEventListener(ev,()=>{lastInput=performance.now();},{capture:true,passive:true}));
function busyNow(){return anim||flip||GD||gesture||edit||field||menu||modal||TOASTS.length||PARTS.length||FX.length||ambMoving()||tokenBounce>0||trashWobble>0||performance.now()-lastInput<1500;}
function frame(ts){
  const raw=(ts-lastTs)/1000||.016;lastTs=ts;frameNo++;
  // when nothing is happening, draw every other frame to save battery
  if(!busyNow()&&frameNo%2===1){skipDt+=raw;requestAnimationFrame(frame);return;}
  const dt=Math.min(.05,raw+skipDt);skipDt=0;
  // automatic quality: if frames are slow while things are moving, lower the resolution a notch
  if(busyNow()&&raw<.5){perfAcc+=raw;perfN++;if(perfN>=90){const avg=perfAcc/perfN;perfAcc=perfN=0;if(avg>1/34&&DPR>1&&ts-perfCheck>4000){perfCheck=ts;DPR_CAP=Math.max(1,DPR-.5);resize();}}}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;HITS=[];
  if(tokenBounce>0)tokenBounce=Math.max(0,tokenBounce-dt*1.2);
  if(trashWobble>0)trashWobble=Math.max(0,trashWobble-dt*1.6);
  try{
    if(anim){anim.t+=dt/anim.dur;const done=anim.t>=1,tt=anim.type==='open'?Math.min(1,anim.t):1-Math.min(1,anim.t);renderBookAnim(tt);HITS=[];
      if(done){if(anim.type==='open'){view='book';if(!S.tipBook){S.tipBook=true;markDirty();toast('Tap the page and start typing — or grab a pen! ✏️',3);}}else{view='desk';curBook=null;}anim=null;}}
    else if(view==='desk')renderDesk(null);
    else renderBook(dt);
    if(!anim)drawAmbPanel(dt);
    renderFX(dt);renderParts(dt);renderMenu();renderModal();drawSaved();renderToasts(dt);
    if(GD){HITS=[];renderDevice(dt);}
    updateHover();drawTooltip();
  }catch(err){console.error(err);}
  if(AMB.master)ambDuck(!!GD);
  remT+=dt;if(remT>1){remT=0;checkReminders();}
  requestAnimationFrame(frame);
}
function resize(){
  DPR=Math.min(DPR_CAP,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  invalidateAll();coverCache.clear();deskSprites.clear();postitSprites.clear();LAYERS.clear();
}
addEventListener('resize',resize);

/* ---------- boot ---------- */
loadState();
if(S.prefs){const d=T,p=S.prefs;T={...d,...p,color:{...d.color,...(p.color||{})},size:{...d.size,...(p.size||{})}};if(!TOOLS.some(t=>t[0]===T.tool)||T.tool==='image')T.tool='text';}
storeUsed=measureUsed();setTimeout(()=>{probeCapacity();checkStorage();},1500);
resize();
for(const p of S.postits)remindLast.set(p.id,Date.now());
if(!S.ambHint){S.ambHint=true;markDirty();setTimeout(()=>toast('🎧 New: relaxing music & sounds — open the SOUNDS tab on the left',4),6000);}
if(!S.welcomed){S.welcomed=true;markDirty();setTimeout(()=>toast('👋 Welcome to your study desk! Tap a notebook to open it.',3.6),500);setTimeout(()=>toast('🎮 Every finished page of notes earns a game token',3.6),2400);}
requestAnimationFrame(frame);
</script>
</body>
